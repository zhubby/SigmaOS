data_dir = "/var/lib/sigmaos"

[api]
host = "127.0.0.1"
port = 3010
allowed_origins = []

[worker]
poll_ms = 750

[admin]
display_name = "SigmaOS Admin"
auth_mode = "local-only"

[model]
provider = "pi"
pi_command = "pi"
local_endpoint = ""

[docker]
enabled = false
socket_path = "/var/run/docker.sock"
compose_command = "docker"
operation_timeout_ms = 120000
console_shells = ["/bin/sh", "/bin/bash"]

# Docker socket access is root-equivalent. Only enable this on a trusted
# single-user appliance, and grant the sigmaos service access deliberately.
# [[docker.compose_roots]]
# id = "apps"
# name = "Apps"
# path = "/srv/compose"

[[nas_roots]]
id = "primary"
name = "Primary NAS"
path = "/srv/nas"
