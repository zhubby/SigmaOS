name = "sigmaos-appliance"
version = "0.1.0"
base_suite = "bookworm"
target_arch = "arm64"

[runtime]
node = ">=22"
database = "sqlite"
init = "systemd"
package = "sigmaos.deb"

[services]
units = [
  "sigmaos-api.service",
  "sigmaos-share-helper.service",
  "sigmaos-worker@1.service",
  "sigmaos-indexer.timer",
  "sigmaos-scheduler.timer",
  "sigmaos-maintenance.timer",
  "sigmaos-backup-daily.timer",
  "sigmaos-backup-weekly.timer",
  "sigmaos-health.timer"
]

[packages]
base = [
  "systemd-sysv",
  "ca-certificates",
  "curl",
  "nodejs",
  "npm",
  "sqlite3",
  "restic",
  "git",
  "rsync"
]
ai = [
  "pi"
]
ocr_media_helpers = [
  "tesseract-ocr",
  "poppler-utils",
  "ffmpeg",
  "imagemagick"
]
nas_health = [
  "smartmontools"
]
archive_helpers = [
  "gzip",
  "unzip",
  "libarchive-tools",
  "unrar-free"
]
sharing = [
  "samba",
  "apache2",
  "apache2-utils",
  "vsftpd",
  "libpam-pwdfile",
  "nfs-kernel-server",
  "minidlna"
]
