data_dir = "/var/lib/sigmaos"
environment = "production"

[api]
host = "127.0.0.1"
port = 3010
allowed_origins = []

[worker]
poll_ms = 750

[admin]
display_name = "SigmaOS Admin"
auth_mode = "local-only"

[model]
provider = "pi"
pi_command = "pi"
local_endpoint = ""

[docker]
enabled = false
socket_path = "/var/run/docker.sock"
compose_command = "docker"
operation_timeout_ms = 120000
console_shells = ["/bin/sh", "/bin/bash"]

[shares]
enabled = false
helper_socket_path = "/run/sigmaos/share-helper.sock"
account_username = "sigma-share"

[[nas_roots]]
id = "primary"
name = "Primary NAS"
path = "/srv/nas"
mount_policy = "required"

[backup]
enabled = false
repository_path = "/srv/backup/restic"
password_file = "/etc/sigmaos/restic-password"
staging_path = "/var/lib/sigmaos/backup-staging"
require_mount = true
retry_count = 2
timeout_ms = 300000
keep_daily = 7
keep_weekly = 4

[health]
stale_index_warning_ms = 7200000
stale_index_critical_ms = 21600000
stalled_run_ms = 900000
consecutive_failure_threshold = 2
backup_stale_ms = 93600000
